<!-- @dsCard group="Brand" viewport="760x460" name="Illustration Style" subtitle="Grainy B&W stipple on paper, single red accent — a 36-piece pool" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--rf-white); padding: 16px; }
  .lead { font-family: var(--font-serif); font-size: 15px; color: var(--rf-ed-ink-soft); margin: 0 0 14px; line-height: 1.45; }
  .lead strong { color: var(--rf-ed-ink); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .art { aspect-ratio: 3/2; overflow: hidden; background: var(--rf-paper-cream); border: 1px solid var(--rf-ed-rule); }
  .art img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; display: block; }
</style>
</head>
<body>
  <p class="lead"><strong>One red accent, everything else greyscale.</strong> Grainy stipple line-work and photographic objects on white or warm cream — used full-bleed or framed with generous negative space. The presentation template rotates a hero from this pool automatically.</p>
  <div class="grid" id="grid"></div>
  <script>
    const grid = document.getElementById("grid");
    for (let i = 1; i <= 36; i++) {
      const fig = document.createElement("figure");
      fig.className = "art";
      fig.style.margin = "0";
      const img = document.createElement("img");
      img.src = "../assets/illustrations/a" + i + ".png";
      img.alt = "";
      fig.appendChild(img);
      grid.appendChild(fig);
    }
  </script>
</body>
</html>

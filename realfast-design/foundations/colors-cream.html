<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-mono); background: var(--rf-white); }
  .ramp { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0; padding: 20px 20px 0; }
  .cell { height: 56px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:5px; font-size:9px; color:#6e6e6e; }
  .lab { text-align: center; font-size: 10px; color: var(--rf-neutral-500); padding: 8px 20px 16px; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="cell" style="background:#F5F3EF">F5F3EF</div>
    <div class="cell" style="background:#F5F0EB">F5F0EB</div>
    <div class="cell" style="background:#F1EBE0">F1EBE0</div>
    <div class="cell" style="background:#EDEAE4">EDEAE4</div>
    <div class="cell" style="background:#F5F2EA">F5F2EA</div>
    <div class="cell" style="background:#F3F0E5">F3F0E5</div>
    <div class="cell" style="background:#F9F4E0">F9F4E0</div>
    <div class="cell" style="background:#F4EDE0">F4EDE0</div>
  </div>
  <div class="lab">On cream, swap the hairline to the warm rule #D9CFC4</div>
</body>
</html>

<!-- @dsCard group="Colors" viewport="700x216" name="Editorial Paper & Ink" subtitle="The light Economist surface — paper, ink, rules" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--rf-white); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; padding: 20px; }
  .sw { border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--rf-neutral-200); }
  .chip { height: 70px; }
  .meta { padding: 7px 9px 9px; }
  .name { font-weight: 600; font-size: 12px; color: var(--rf-ink); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--rf-neutral-500); margin-top: 2px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--rf-paper)"></div><div class="meta"><div class="name">Paper</div><div class="hex">#FFFFFF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rf-paper-cream)"></div><div class="meta"><div class="name">Cream</div><div class="hex">#F5F3EF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rf-ed-ink)"></div><div class="meta"><div class="name">Ink</div><div class="hex">#121212</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rf-ed-muted)"></div><div class="meta"><div class="name">Muted</div><div class="hex">#6E6E6E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rf-ed-red)"></div><div class="meta"><div class="name">Rubric red</div><div class="hex">#E3120B</div></div></div>
  </div>
  <p style="font-family:'IBM Plex Sans Condensed',var(--font-sans),sans-serif;font-size:12.5px;line-height:1.55;color:var(--rf-ed-ink-soft);border-top:1px solid var(--rf-ed-rule);margin:0;padding:14px 20px 4px;flex:0 0 100%;width:100%;box-sizing:border-box;"><b style="color:var(--rf-ed-ink);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;font-size:11px;margin-right:8px;">Usage</b>The light Economist surface. Paper (#FFF) or Cream ground, Ink for text, Muted for meta, Rubric red for the section word only. Pair with Source Serif 4 + IBM Plex Sans Condensed.</p>
</body>
</html>

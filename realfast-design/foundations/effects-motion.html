<!-- @dsCard group="Effects" viewport="700x120" name="Motion" subtitle="Easing curves & durations" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--rf-white); padding: 20px 24px; }
  .row { display:flex; align-items:center; gap:14px; margin-bottom:10px; }
  .track { flex:1; height: 4px; background: var(--rf-neutral-100); border-radius:2px; position:relative; overflow:hidden; }
  .dot { position:absolute; top:-5px; left:0; width:14px; height:14px; border-radius:50%; background:var(--rf-blue); animation: slide 2.4s infinite; }
  .e1 .dot { animation-timing-function: var(--ease-standard); }
  .e2 .dot { animation-timing-function: var(--ease-out); }
  .e3 .dot { animation-timing-function: var(--ease-in-out); }
  @keyframes slide { 0%,12% { left:0 } 50%,62% { left:calc(100% - 14px) } 100% { left:0 } }
  .lab { width: 230px; font-family: var(--font-mono); font-size: 11px; color: var(--rf-neutral-600); }
</style>
</head>
<body>
  <div class="row e1"><span class="lab">standard · .2,0,0,1 · 200ms</span><div class="track"><div class="dot"></div></div></div>
  <div class="row e2"><span class="lab">out (entrance) · .16,1,.3,1 · 360ms</span><div class="track"><div class="dot"></div></div></div>
  <div class="row e3"><span class="lab">in-out · .65,0,.35,1</span><div class="track"><div class="dot"></div></div></div>
</body>
</html>

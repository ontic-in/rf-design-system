<!-- @dsCard group="Spacing" viewport="700x216" name="Spacing Scale" subtitle="4px base step" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-mono); background: var(--rf-white); padding: 20px 24px; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 7px; }
  .bar { background: var(--rf-blue); height: 14px; border-radius: 2px; }
  .lab { font-size: 11px; color: var(--rf-neutral-500); width: 100px; }
</style>
</head>
<body>
  <div class="row"><span class="lab">1 · 4px</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="lab">2 · 8px</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="lab">4 · 16px</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="lab">6 · 24px</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="lab">8 · 32px</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="lab">12 · 48px</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="lab">16 · 64px</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="lab">24 · 96px</span><div class="bar" style="width:96px"></div></div>
  <p style="font-family:'IBM Plex Sans Condensed',var(--font-sans),sans-serif;font-size:12.5px;line-height:1.55;color:var(--rf-ed-ink-soft);border-top:1px solid var(--rf-ed-rule);margin:0;padding:14px 20px 4px;flex:0 0 100%;width:100%;box-sizing:border-box;"><b style="color:var(--rf-ed-ink);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;font-size:11px;margin-right:8px;">Usage</b>4px base step. Compose spacing from the scale (4/8/16/24/32/48/64/96) — no arbitrary values. Small steps for component padding, 48–96 for section rhythm.</p>
</body>
</html>

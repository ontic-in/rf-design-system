<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-serif); background: var(--rf-white); padding: 22px 28px; color: var(--rf-ed-ink); display:flex; gap: 32px; align-items:center; }
  .lede { flex: 1; font-size: 18px; line-height: 1.6; max-width: 320px; margin: 0; }
  .lede::first-letter { float: left; font-weight: 700; font-size: 76px; line-height: 0.82; padding: 6px 8px 0 0; margin-top: 4px; }
  blockquote { flex: 1; margin: 0; padding: 18px 0; border-top: 1px solid var(--rf-ed-rule); border-bottom: 1px solid var(--rf-ed-rule); text-align: center; }
  blockquote p { font-size: 24px; line-height: 1.35; font-weight: 600; font-style: italic; margin: 0; }
</style>
</head>
<body>
  <p class="lede">Most production systems should route through AI once on the way in, run normal code in the middle, and route out.</p>
  <blockquote><p>Use tokens like a scalpel, not a sword.</p></blockquote>
</body>
</html>

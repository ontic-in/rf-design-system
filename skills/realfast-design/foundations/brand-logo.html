<!-- @dsCard group="Brand" viewport="700x206" name="Logo" subtitle="realfast wordmark — on paper, on cream" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); display:flex; flex-wrap:wrap; }
  .pane { flex:1; height: 140px; display:flex; align-items:center; justify-content:center; }
  .paper { background: var(--rf-paper); }
  .cream { background: var(--rf-paper-cream); border-left: 1px solid var(--rf-ed-rule-warm); }
  /* The supplied logo is white-fill; invert to ink for the light editorial surface */
  .pane img { height: 30px; filter: brightness(0); }
</style>
</head>
<body>
  <div class="pane paper"><img src="../assets/logos/realfast-logo-white.svg" alt="realfast" /></div>
  <div class="pane cream"><img src="../assets/logos/realfast-logo-white.svg" alt="realfast" /></div>
  <p style="font-family:'IBM Plex Sans Condensed',var(--font-sans),sans-serif;font-size:12.5px;line-height:1.55;color:var(--rf-ed-ink-soft);border-top:1px solid var(--rf-ed-rule);margin:0;padding:14px 20px 4px;flex:0 0 100%;width:100%;box-sizing:border-box;"><b style="color:var(--rf-ed-ink);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;font-size:11px;margin-right:8px;">Usage</b>One wordmark, ink on light. The supplied SVG is white-fill — invert to ink (filter: brightness(0)) on paper and cream. Never place the white logo on a light surface or recolour it.</p>
</body>
</html>

<!-- @dsCard group="Colors" viewport="700x216" name="Brand Core" subtitle="The four canonical realfast brand colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--rf-white); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 20px; }
  .sw { border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--rf-neutral-200); }
  .chip { height: 78px; }
  .meta { padding: 8px 10px 10px; }
  .name { font-weight: 600; font-size: 13px; color: var(--rf-ink); letter-spacing: 0.01em; }
  .hex { font-family: var(--font-mono); font-size: 12px; color: var(--rf-neutral-500); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--rf-blue)"></div><div class="meta"><div class="name">Blue</div><div class="hex">#362CFF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rf-navy)"></div><div class="meta"><div class="name">Navy</div><div class="hex">#191970</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rf-red)"></div><div class="meta"><div class="name">Red</div><div class="hex">#F7394D</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rf-ink)"></div><div class="meta"><div class="name">Ink</div><div class="hex">#111111</div></div></div>
  </div>
  <p style="font-family:'IBM Plex Sans Condensed',var(--font-sans),sans-serif;font-size:12.5px;line-height:1.55;color:var(--rf-ed-ink-soft);border-top:1px solid var(--rf-ed-rule);margin:0;padding:14px 20px 4px;flex:0 0 100%;width:100%;box-sizing:border-box;"><b style="color:var(--rf-ed-ink);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;font-size:11px;margin-right:8px;">Usage</b>The four canonical UI colours. Blue for primary action and links, Navy for depth, Red for a single emphasis, Ink for text. Don’t add new UI colours — the muted --rf-illus-* shades are illustration-only.</p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-mono); background: var(--rf-white); }
  .ramp { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0; padding: 20px 20px 0; }
  .cell { height: 56px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:5px; font-size:9px; color:#6e6e6e; }
  .lab { text-align: center; font-size: 10px; color: var(--rf-neutral-500); padding: 8px 20px 16px; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="cell" style="background:#F5F3EF">F5F3EF</div>
  </div>
  <div class="lab">One cream, #F5F3EF. Hairlines stay stone-200 #E2DED6</div>
  <p style="font-family:'IBM Plex Sans Condensed',var(--font-sans),sans-serif;font-size:12.5px;line-height:1.55;color:var(--rf-ed-ink-soft);border-top:1px solid var(--rf-ed-rule);margin:0;padding:14px 20px 4px;flex:0 0 100%;width:100%;box-sizing:border-box;"><b style="color:var(--rf-ed-ink);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;font-size:11px;margin-right:8px;">Usage</b>One cream for featured bands, wells and callouts (--surface-raised, --surface-inset). Muted text on cream uses stone-600, never stone-500. Not a text colour.</p>
</body>
</html>

<!-- @dsCard group="Colors" viewport="700x196" name="Neutral Ramp" subtitle="Warm-cool greys — product surfaces & text" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--rf-white); }
  .ramp { display: grid; grid-template-columns: repeat(11, 1fr); gap: 0; padding: 20px 20px 0; }
  .cell { height: 64px; }
  .lab { text-align: center; font-size: 10px; color: var(--rf-neutral-500); padding: 8px 20px 18px; font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="ramp">
    <div class="cell" style="background:var(--rf-white);box-shadow:inset 0 0 0 1px var(--rf-neutral-200)"></div>
    <div class="cell" style="background:var(--rf-neutral-50)"></div>
    <div class="cell" style="background:var(--rf-neutral-100)"></div>
    <div class="cell" style="background:var(--rf-neutral-200)"></div>
    <div class="cell" style="background:var(--rf-neutral-300)"></div>
    <div class="cell" style="background:var(--rf-neutral-400)"></div>
    <div class="cell" style="background:var(--rf-neutral-500)"></div>
    <div class="cell" style="background:var(--rf-neutral-600)"></div>
    <div class="cell" style="background:var(--rf-neutral-700)"></div>
    <div class="cell" style="background:var(--rf-neutral-800)"></div>
    <div class="cell" style="background:var(--rf-neutral-900)"></div>
  </div>
  <div class="lab">white · 50 · 100 · 200 · 300 · 400 · 500 · 600 · 700 · 800 · 900 (#111)</div>
  <p style="font-family:'IBM Plex Sans Condensed',var(--font-sans),sans-serif;font-size:12.5px;line-height:1.55;color:var(--rf-ed-ink-soft);border-top:1px solid var(--rf-ed-rule);margin:0;padding:14px 20px 4px;flex:0 0 100%;width:100%;box-sizing:border-box;"><b style="color:var(--rf-ed-ink);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;font-size:11px;margin-right:8px;">Usage</b>Product greys. 50–100 for surfaces, 200–300 for borders and rules, 500–700 for secondary text, 900 for ink. Warm rules on cream, cool greys on white.</p>
</body>
</html>

<!-- @dsCard group="Effects" viewport="700x226" name="Shadows" subtitle="Editorial near-flat elevation — hairline rules over shadow" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-mono); }
  .pane { padding: 28px 24px; display:flex; gap:24px; align-items:center; flex-wrap:wrap; background: var(--rf-neutral-50); }
  .card { width: 96px; height: 64px; border-radius: 2px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:7px; font-size:10px; background:#fff; color:#8a8a93; }
</style>
</head>
<body>
  <div class="pane">
    <div class="card" style="box-shadow:var(--shadow-ed-card)">ed-card</div>
    <div class="card" style="box-shadow:var(--shadow-ed-raise)">ed-raise</div>
    <div class="card" style="border:1px solid var(--rf-ed-rule); box-shadow:none">hairline</div>
  </div>
  <p style="font-family:'IBM Plex Sans Condensed',var(--font-sans),sans-serif;font-size:12.5px;line-height:1.55;color:var(--rf-ed-ink-soft);border-top:1px solid var(--rf-ed-rule);margin:0;padding:14px 20px 4px;flex:0 0 100%;width:100%;box-sizing:border-box;"><b style="color:var(--rf-ed-ink);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;font-size:11px;margin-right:8px;">Usage</b>Near-flat elevation. Prefer a 1px hairline rule over shadow; ed-card for resting cards, ed-raise only on hover/lift. No heavy drop shadows on the editorial surface.</p>
</body>
</html>
